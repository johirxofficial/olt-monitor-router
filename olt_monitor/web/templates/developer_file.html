{% extends "base.html" %}
{% block title %}{{ file_path }} - {{ app_title }}{% endblock %}
{% block content %}

<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <div class="min-w-0">
    <h6 class="mb-0 text-truncate"><i class="bi bi-file-earmark-code"></i> <code>{{ file_path }}</code></h6>
    <div class="small text-secondary">{{ size | bytes }}</div>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-sm btn-outline-secondary" href="/developer/files"><i class="bi bi-arrow-left"></i> All files</a>
    <a class="btn btn-sm btn-outline-primary" href="/developer/file?path={{ file_path | urlencode }}&download=1">
      <i class="bi bi-download"></i> Download
    </a>
  </div>
</div>

<pre class="bg-dark text-light rounded p-3 small" style="max-height:70vh;overflow:auto"><code>{{ content }}</code></pre>

{% endblock %}
